<svg viewBox="0 0 304 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Questino">
  <title>Questino</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&amp;display=swap');
    </style>
    <linearGradient id="bolt-g" x1="0.6" y1="0" x2="0.3" y2="1">
      <stop offset="0%"   stop-color="#FFE566"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>
    <!-- Subtle warm glow behind bolt -->
    <radialGradient id="glow" cx="30%" cy="50%" r="28%">
      <stop offset="0%"   stop-color="#FFD700" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="304" height="80" rx="10" fill="#1a1a2e"/>

  <!-- Glow -->
  <rect width="304" height="80" rx="10" fill="url(#glow)"/>

  <!-- Lightning bolt -->
  <polygon
    points="38,10 14,44 24,44 10,70 36,36 26,36"
    fill="url(#bolt-g)"
  />

  <!-- Wordmark -->
  <text
    x="54"
    y="57"
    fill="#FFD700"
    font-family="'Baloo 2', 'Arial Rounded MT Bold', 'Trebuchet MS', Arial, sans-serif"
    font-size="46"
    font-weight="800"
    letter-spacing="-1"
  >Questino</text>
</svg>
